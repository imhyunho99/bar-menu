{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메뉴판 사진으로 등록 - bar-menu</title>
    <link rel="stylesheet" href="{% static 'css/admin.css' %}">
</head>
<body class="brand">
    <div class="admin-container">
        <div class="admin-form">
            <h2>메뉴판 사진으로 등록</h2>

            {% if messages %}
                {% for message in messages %}
                    <div class="admin-error">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <p>
                쓰시던 종이 메뉴판을 찍어 올려 주세요. 저희가 확인하고 카테고리와 메뉴로
                정리해서 넣어 드립니다. 정리가 끝나면 알려 드립니다.
            </p>

            <form method="post" enctype="multipart/form-data" id="menu-photo-form">
                {% csrf_token %}

                <div class="admin-form-group">
                    <label for="menu_image">메뉴판 사진 (필수 · 최대 {{ max_images }}장)</label>
                    <input type="file" id="menu_image" name="menu_image" accept="image/*" multiple required>
                    <small>
                        글자가 또렷하게 나오도록 정면에서 찍어 주세요.
                        여러 장이면 한 번에 고르셔도 됩니다.
                    </small>
                    <p class="import-picked" id="menu-photo-count" hidden></p>
                </div>

                <button type="submit" class="admin-btn" id="menu-photo-submit">사진 보내기</button>
                <a href="{% url 'menu:admin_dashboard' restaurant_slug=request.restaurant.slug %}" class="admin-btn admin-btn-secondary">취소</a>
            </form>
        </div>
    </div>

<script>
/*
 * 보내기 전에 브라우저에서 사진을 줄인다.
 *
 * 폰 사진 한 장이 3.6MB 라 10장이면 36MB 다. nginx 의 client_max_body_size 가
 * 20MB 라 그대로 보내면 사장님은 뜻 모를 413 을 보고, 서버까지 왔더라도 워커
 * 하나가 130MB 넘게 쓴다(실측). 긴 변 2000px 로 줄이면 10장이 7.6MB 가 되고
 * 서버 메모리도 18MB 로 떨어진다. 글자는 그대로 읽힌다.
 *
 * 실패하면 원본 그대로 보낸다. 서버가 어차피 한 번 더 줄이므로 결과는 같고,
 * 여기서 막으면 구형 폰에서 아예 못 올린다.
 */
(function () {
  var MAX_EDGE = 2000, MAX_IMAGES = {{ max_images }};
  var input = document.getElementById('menu_image');
  var form = document.getElementById('menu-photo-form');
  var submit = document.getElementById('menu-photo-submit');
  var count = document.getElementById('menu-photo-count');
  if (!input || !form || !window.FileReader) return;

  var shrunk = null;

  input.addEventListener('change', function () {
    shrunk = null;
    var n = input.files.length;
    count.hidden = n === 0;
    if (n > MAX_IMAGES) {
      count.textContent = n + '장을 고르셨습니다. ' + MAX_IMAGES + '장까지만 올릴 수 있어요.';
      count.className = 'import-picked import-picked-over';
    } else if (n > 0) {
      count.textContent = n + '장 선택함';
      count.className = 'import-picked';
    }
  });

  function shrinkOne(file) {
    return new Promise(function (resolve) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(url);
        var r = Math.min(1, MAX_EDGE / Math.max(img.width, img.height));
        if (r === 1) return resolve(file);           // 이미 작으면 그대로
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * r);
        c.height = Math.round(img.height * r);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(function (blob) {
          resolve(blob && blob.size < file.size ? new File([blob], file.name, {type: 'image/jpeg'}) : file);
        }, 'image/jpeg', 0.85);
      };
      img.onerror = function () { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

  form.addEventListener('submit', function (e) {
    if (shrunk || !input.files.length || input.files.length > MAX_IMAGES) return;
    e.preventDefault();
    submit.disabled = true;
    submit.textContent = '사진 줄이는 중...';
    Promise.all(Array.prototype.map.call(input.files, shrinkOne)).then(function (files) {
      var dt = new DataTransfer();
      files.forEach(function (f) { dt.items.add(f); });
      input.files = dt.files;
      shrunk = true;
      submit.textContent = '보내는 중...';
      form.submit();
    }).catch(function () {
      shrunk = true;                                  // 원본 그대로라도 보낸다
      form.submit();
    });
  });
})();
</script>
</body>
</html>
