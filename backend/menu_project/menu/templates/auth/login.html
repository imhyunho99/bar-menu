{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 — bar-menu</title>
    <style>
        /* 랜딩(frontend/src/styles/marketing.css)과 같은 팔레트 */
        :root { --ink: #0a0a0b; --ash: #6c6c74; --line: #e6e6e9; --amber: #a6650b; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #fff; color: var(--ink); padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
            word-break: keep-all; -webkit-font-smoothing: antialiased;
        }
        .box { width: 100%; max-width: 22rem; }
        h1 { font-size: 24px; font-weight: 800; letter-spacing: -.04em; margin: 0 0 8px; }
        .sub { font-size: 14px; color: var(--ash); margin: 0 0 32px; line-height: 1.7; }
        label { display: block; margin-bottom: 16px; }
        label span { display: block; font-size: 11.5px; font-weight: 600; margin-bottom: 6px; }
        input {
            width: 100%; padding: 13px 16px; font-size: 15px; font-family: inherit;
            border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink);
        }
        input:focus { outline: none; border-color: var(--ink); }
        button {
            width: 100%; margin-top: 8px; padding: 14px; font-size: 15px; font-weight: 700;
            font-family: inherit; color: #fff; background: var(--ink);
            border: 0; border-radius: 10px; cursor: pointer;
        }
        button:hover { background: var(--ash); }
        .err {
            font-size: 13px; color: #b3261e; background: #fdf3f2; border: 1px solid #f5d5d2;
            border-radius: 8px; padding: 11px 14px; margin-bottom: 20px; line-height: 1.6;
        }
        .foot { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line);
                font-size: 13px; color: var(--ash); text-align: center; }
        .foot a { color: var(--ink); font-weight: 600; }
        :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>로그인</h1>
        <p class="sub">매장 주소를 몰라도 됩니다. 계정으로 찾아 드립니다.</p>

        {% if messages %}
            {% for message in messages %}<div class="err">{{ message }}</div>{% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <label>
                <span>이메일</span>
                <input type="email" name="email" value="{{ email }}" autocomplete="username" required autofocus>
            </label>
            <label>
                <span>비밀번호</span>
                <input type="password" name="password" autocomplete="current-password" required>
            </label>
            <button type="submit">로그인</button>
        </form>

        <p class="foot">아직 계정이 없으신가요? <a href="{% url 'signup' %}">무료로 시작하기</a></p>
    </div>
</body>
</html>
