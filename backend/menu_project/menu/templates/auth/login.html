{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 — bar-menu</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="{% static 'css/brand.css' %}">
    <style>
        /* 사장님이 매일 지나는 입구다. 랜딩에서 가입하고 여기로 돌아오므로
           두 화면이 같은 제품으로 읽혀야 한다. 값은 brand.css 가 들고 있고
           여기서는 이 화면만의 배치를 정한다. */
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        a { color: inherit; }

        .box { width: 100%; max-width: 22rem; }

        /* 랜딩의 모노 대문자 눈썹. 로고 대신 이걸 쓰면 화면이 조용해지고
           세 화면(랜딩·로그인·관리)이 같은 장치로 묶인다. */
        .eyebrow {
            display: block;
            margin-bottom: 22px;
            color: var(--amber);
        }

        .sub {
            margin: 0 0 32px;
            color: var(--ash);
        }

        .submit { width: 100%; margin-top: 4px; padding: 15px 28px; }

        .foot {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--line);
            color: var(--ash);
            text-align: center;
        }
        .foot a { font-weight: 600; color: var(--ink); }
    </style>
</head>
<body class="brand">
    <div class="box">
        <span class="eyebrow en">bar-menu</span>
        <h1>로그인</h1>
        <p class="sub sm">매장 주소를 몰라도 됩니다. 계정으로 찾아 드립니다.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="notice notice-error">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="field">
                <label for="email">이메일</label>
                <input type="email" id="email" name="email" value="{{ email }}"
                       autocomplete="username" required autofocus>
            </div>
            <div class="field">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password"
                       autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-solid submit">로그인</button>
        </form>

        <p class="foot cap">
            아직 매장이 없으신가요? <a href="{% url 'signup' %}">매장 만들기</a>
        </p>
    </div>
</body>
</html>
