{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ restaurant.name }} — 메뉴판을 열 수 없습니다</title>
    <style>
        /* 손님이 보는 화면이라 marketing 팔레트를 따른다 */
        :root { --ink: #0a0a0b; --ash: #6c6c74; --line: #e6e6e9; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #fff; color: var(--ink); padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
            word-break: keep-all; -webkit-font-smoothing: antialiased;
        }
        .box { max-width: 26rem; text-align: center; }
        h1 { font-size: 21px; font-weight: 800; letter-spacing: -.03em; margin: 0 0 14px; }
        p { font-size: 15px; line-height: 1.75; color: var(--ash); margin: 0; }
        .store { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line);
                 font-size: 12.5px; color: var(--ash); }
    </style>
</head>
<body>
    <div class="box">
        <h1>지금은 메뉴판을 열 수 없습니다</h1>
        <p>
            잠시 후 다시 시도해 주세요.<br>
            급하시면 매장 직원에게 문의해 주세요.
        </p>
        <p class="store">{{ restaurant.name }}</p>
    </div>
</body>
</html>
